aid: trinet
name: TriNet
description: >-
  TriNet is a Dublin, California-based professional employer organization
  (PEO) for small and mid-market businesses, founded in 1988 by Martin
  Babinec and led today by President and CEO Mike Simonds. TriNet delivers
  full-service HR through a co-employment model — payroll processing,
  Fortune-500-grade health, retirement and ancillary benefits, workers'
  compensation, employment-practices liability coverage, compliance and risk
  management, and strategic HR advisory — to thousands of SMBs across the
  United States. The company offers two main packages: TriNet PEO (full
  co-employment) and HR Plus (technology platform plus support). TriNet is
  publicly traded on the NYSE as TNET with trailing-twelve-month revenue of
  roughly $5.0B as of FY2025. TriNet exposes its HR Customer Platform through
  three SwaggerHub-documented API groups — DCP, HRIS, and PEO — covering
  Employees, Companies, Payroll, Money, and Time-Off domains, with API
  credentials issued to approved customers and Integration Center partners
  rather than offered as a fully open developer program; OpenAPI/Swagger,
  Postman/Insomnia collections, a sandbox, OAuth playground, and webhook
  management are available to authorized developers. Public 1:1 API access
  typically requires partner-program qualification and technical review,
  which is why most TriNet customers consume the platform via the curated
  Integration Center marketplace (accounting, HRIS, identity, ATS, payroll,
  benefits and learning partners) or via unified-API aggregators such as
  Finch, Merge, Apideck and Truto.
